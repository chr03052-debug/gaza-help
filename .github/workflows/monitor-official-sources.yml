name: Monitor official source links

on:
  schedule:
    # Runs every day at 12:17 JST (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-official-source-links
  cancel-in-progress: false

jobs:
  check-links:
    name: Check official source links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check URLs listed in data.json
        shell: bash
        run: |
          set -uo pipefail

          data_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/data.json"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --proto '=https' \
            --proto-redir '=https' \
            --user-agent "gaza-help-source-monitor/1.0" \
            "$data_url" \
            --output /tmp/gaza-help-data.json

          mapfile -t urls < <(
            python3 -c '
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source_file:
              records = json.load(source_file)

          urls = sorted({
              item["source_url"]
              for item in records
              if isinstance(item, dict) and item.get("source_url")
          })

          if not urls:
              raise SystemExit("No source_url values found in data.json")

          print(*urls, sep="\n")
          ' /tmp/gaza-help-data.json
          )

          failures=0

          for url in "${urls[@]}"; do
            echo "::group::Checking $url"

            curl_exit=0
            http_code="$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 90 \
              --retry 2 \
              --retry-delay 5 \
              --proto '=https' \
              --proto-redir '=https' \
              --user-agent "gaza-help-source-monitor/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              "$url")" || curl_exit=$?

            if [[ $curl_exit -ne 0 ]]; then
              echo "::error title=Official source unreachable::curl exit $curl_exit for $url"
              failures=$((failures + 1))
            elif [[ "$http_code" =~ ^(2|3)[0-9][0-9]$ ]]; then
              echo "OK: HTTP $http_code"
            else
              echo "::error title=Official source returned HTTP $http_code::$url"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          if [[ $failures -gt 0 ]]; then
            echo "::error::$failures official source link(s) need manual review."
            exit 1
          fi

          echo "All official source links are reachable."
