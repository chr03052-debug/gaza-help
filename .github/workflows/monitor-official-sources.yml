name: Monitor official source links and content

on:
  schedule:
    # Runs every day at 12:17 JST (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-official-sources
  cancel-in-progress: false

jobs:
  check-sources:
    name: Check official source reachability and content markers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check monitor script syntax
        run: node --check tests/monitor-sources.mjs
      - name: Check official source links and expected content
        run: node tests/monitor-sources.mjs
