name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/validate.mjs\n          node --check tests/browser-smoke.mjs
      - name: Validate content, safety rules, and offline assets
        run: node tests/validate.mjs
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile, bilingual, keyboard, and offline smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gaza-help-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/browser-smoke.mjs
